<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Update Dhanz AI</title>
  <style>
    body {font: 17px system-ui,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:32px;line-height:1.6}
    main {max-width:620px;margin:8vh auto} button {font:inherit;padding:12px 24px;border:0;border-radius:10px;background:#93c5fd;color:#111827;cursor:pointer}
    button:disabled {opacity:.6} #status {white-space:pre-wrap} a {color:#93c5fd}
  </style>
</head>
<body>
  <main>
    <h1>Refresh your Dhanz app</h1>
    <p>This loads the build installed on your server and replaces cached app files. Your sign-in and saved data are kept.</p>
    <p>Finish uploads and save unsent text first. Future GitHub builds can be installed using <strong>Settings → App update → Update</strong> inside Dhanz.</p>
    <button id="refresh">Refresh installed app</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="./">Back to Dhanz</a></p>
  </main>
  <script src="force_update.js?build=40" defer></script>
</body>
</html>
