# Overlay for docker-compose.prod.yml. API migrations run before the worker becomes healthy.
services:
  api:
    environment:
      CREATIVE_WORKER_ENABLED: "false"
  creative-worker:
    image: ${DHANZ_IMAGE:-ghcr.io/rodsangle/dhanzai/api:latest}
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dhanz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dhanz}
      CREATIVE_WORKER_ENABLED: "false"
      LOG_FORMAT: json
    command: ["python", "-m", "app.generation_jobs"]
    depends_on:
      api:
        condition: service_healthy
    # The API's HTTP health check is inapplicable to a queue worker.
    healthcheck:
      disable: true
    restart: unless-stopped
