[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhanz-knowledge-engine"
version = "0.3.0"
description = "DHANZ AI web research and retrieval (search, polite fetching, extraction, embeddings, ranking)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "fpdf2>=2.7"]

[tool.setuptools.packages.find]
include = ["dhanz_knowledge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
