# Local/self-hosted stack: PostgreSQL (with pgvector), Redis, and the DHANZ AI API.
#   cp .env.example .env   # then fill in at least one AI provider key and JWT_SECRET
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhanz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dhanz}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhanz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    # Shared rate limits (and per-account login lockout) across API replicas.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dhanz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dhanz}
      STORAGE_DIR: /srv/data/uploads
      CREATIVE_STORAGE_DIR: /srv/data/creations
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/srv/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  clamav:
    # Optional malware scanning for uploads: `docker compose --profile scan up -d` and set CLAMAV_HOST=clamav.
    image: clamav/clamav:stable
    profiles: ["scan"]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
