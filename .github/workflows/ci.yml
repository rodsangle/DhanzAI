name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend + AI engine (lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check backend ai_engine tests scripts
          ruff format --check backend ai_engine tests scripts
      - name: AI engine tests
        working-directory: ai_engine
        run: pytest -q
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  backend-postgres:
    name: Backend on PostgreSQL + pgvector (migrations, e2e smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dhanz
          POSTGRES_PASSWORD: dhanz
          POSTGRES_DB: dhanz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dhanz" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://dhanz:dhanz@localhost:5432/dhanz
      JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Enable extensions
        run: PGPASSWORD=dhanz psql -h localhost -U dhanz -d dhanz -f database/init/01-extensions.sql
      - name: Migrate (upgrade, downgrade, upgrade)
        working-directory: backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Start API and run smoke test
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break; sleep 1; done
          python ../tests/e2e/smoke_test.py --base-url http://localhost:8000

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/Dockerfile -t dhanz-api:ci .

  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dhanz_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
