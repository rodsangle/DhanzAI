name: Release builds

# Builds installable apps for every platform. Push a tag like v0.1.0 to publish a GitHub
# Release, or run manually to get build artifacts only.
#
# Repository variables:  DHANZ_API_URL                 backend URL baked into the apps (https://...)
# Repository secrets (optional; unsigned/debug-signed builds are produced without them):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_EXPORT_OPTIONS_PLIST_BASE64, IOS_KEYCHAIN_PASSWORD
# See docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  APP_DIR: apps/dhanz_flutter

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DHANZ_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building with debug signing (not accepted by Google Play)."
          fi
      - name: Build APK and App Bundle
        working-directory: ${{ env.APP_DIR }}
        env:
          DHANZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DHANZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DHANZ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=DHANZ_API_URL="$API_URL"
          flutter build appbundle --release --dart-define=DHANZ_API_URL="$API_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dhanz-ai-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/dhanz-ai-${{ github.ref_name }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APP_DIR }}/dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          flutter build windows --release --dart-define=DHANZ_API_URL="$env:API_URL"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') { $version = "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\dhanz_ai.iss"
          Compress-Archive -Path "${{ env.APP_DIR }}\build\windows\x64\runner\Release\*" -DestinationPath "dist\dhanz-ai-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install signing certificate and profile
        id: signing
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_B64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$EXPORT_B64" ]; then
            echo "::warning::iOS signing secrets not set: producing an unsigned build (cannot be installed on devices)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$EXPORT_B64" | base64 -d > "$RUNNER_TEMP/ExportOptions.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/dhanz.mobileprovision
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=DHANZ_API_URL="$API_URL"
            cp build/ios/ipa/*.ipa dist/
          else
            flutter build ios --release --no-codesign --dart-define=DHANZ_API_URL="$API_URL"
            (cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/$APP_DIR/dist/dhanz-ai-ios-unsigned.zip" Runner.app)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.APP_DIR }}/dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
