name: Release builds

# Builds installable apps for every platform. Push a tag like v0.1.0 to publish a GitHub
# Release, or run manually to get build artifacts only.
#
# Repository variables:  DHANZ_API_URL                 backend URL baked into the apps (https://...)
#                        GOOGLE_IOS_CLIENT_ID          optional: enables "Continue with Google" on iOS
# Repository secrets (optional; unsigned/debug-signed builds are produced without them):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_EXPORT_OPTIONS_PLIST_BASE64, IOS_KEYCHAIN_PASSWORD
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD       Authenticode code signing
#   DHANZ_GOOGLE_SERVICES_JSON                           Firebase config: enables Android push
# A tagged release also publishes latest.json (the in-app update manifest). Point the backend's
# UPDATE_MANIFEST_FILE at a copy of it. See docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build. A version tag always builds every platform.
        type: choice
        default: all
        options:
          - all
          - windows

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  APP_DIR: apps/dhanz_flutter
  # Version shown in the app and compared by the update check: v0.4.0 -> 0.4.0 (manual runs keep pubspec's).
  BUILD_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '' }}

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DHANZ_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Configure the existing Android release signing key. A newly generated debug key cannot update installed copies."
            exit 1
          fi
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.DHANZ_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$APP_DIR/android/app/google-services.json"
          else
            echo "::warning::No DHANZ_GOOGLE_SERVICES_JSON secret: the Android app is built without push notifications."
          fi
      - name: Build APK and App Bundle
        working-directory: ${{ env.APP_DIR }}
        env:
          DHANZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DHANZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DHANZ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          VERSION_ARGS=""
          if [ -n "$BUILD_NAME" ]; then VERSION_ARGS="--build-name=${BUILD_NAME#v} --build-number=$GITHUB_RUN_NUMBER"; fi
          flutter build apk --release $VERSION_ARGS --dart-define=DHANZ_API_URL="$API_URL"
          flutter build appbundle --release $VERSION_ARGS --dart-define=DHANZ_API_URL="$API_URL"
          mkdir -p dist
          NAME="${GITHUB_REF_NAME//\//-}"   # manual runs on branches like dependabot/... have slashes
          cp build/app/outputs/flutter-apk/app-release.apk "dist/dhanz-ai-$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/dhanz-ai-$NAME.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APP_DIR }}/dist/*

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          $versionArgs = @()
          if ($env:BUILD_NAME) { $versionArgs = @("--build-name=$($env:BUILD_NAME.TrimStart('v'))", "--build-number=$env:GITHUB_RUN_NUMBER") }
          flutter build windows --release @versionArgs --dart-define=DHANZ_API_URL="$env:API_URL"
      - name: Prepare code signing
        id: wincert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Output "::warning::No WINDOWS_CERT_PFX_BASE64 secret: the Windows app and installer are unsigned (SmartScreen will warn)."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Sign the app
        if: steps.wincert.outputs.signed == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ env.APP_DIR }}\build\windows\x64\runner\Release\dhanz_ai.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          # A branch name is not a version. Use pubspec so a manual build keeps the
          # same AppVersion as the installed app and Inno replaces that install.
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            $match = Select-String -Path "${{ env.APP_DIR }}/pubspec.yaml" -Pattern '^version:\s*(\d+\.\d+\.\d+)'
            if ($match) { $version = $match.Matches[0].Groups[1].Value } else { $version = "0.0.0-dev" }
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "scripts\windows\dhanz_ai.iss"
          Compress-Archive -Path "${{ env.APP_DIR }}\build\windows\x64\runner\Release\*" -DestinationPath "dist\dhanz-ai-$version-windows-portable.zip"
      - name: Sign the installer
        if: steps.wincert.outputs.signed == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          Get-ChildItem dist\*-setup.exe | ForEach-Object {
            & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Remove certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install signing certificate and profile
        id: signing
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_B64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$EXPORT_B64" ]; then
            echo "::warning::iOS signing secrets not set: producing an unsigned build (cannot be installed on devices)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$EXPORT_B64" | base64 -d > "$RUNNER_TEMP/ExportOptions.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/dhanz.mobileprovision
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Google Sign-In URL scheme
        # With the iOS OAuth client ID set, the app offers "Continue with Google"; iOS returns to the
        # app through the client ID's reversed form, registered here as a URL scheme.
        if: vars.GOOGLE_IOS_CLIENT_ID != ''
        working-directory: ${{ env.APP_DIR }}
        env:
          CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          REVERSED="com.googleusercontent.apps.${CLIENT_ID%.apps.googleusercontent.com}"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" ios/Runner/Info.plist
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          API_URL: ${{ vars.DHANZ_API_URL }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter pub get
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            flutter build ipa --release ${BUILD_NAME:+--build-name=${BUILD_NAME#v} --build-number=$GITHUB_RUN_NUMBER} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=DHANZ_API_URL="$API_URL" --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"
            cp build/ios/ipa/*.ipa dist/
          else
            flutter build ios --release --no-codesign ${BUILD_NAME:+--build-name=${BUILD_NAME#v} --build-number=$GITHUB_RUN_NUMBER} --dart-define=DHANZ_API_URL="$API_URL" --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"
            (cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/$APP_DIR/dist/dhanz-ai-ios-unsigned.zip" Runner.app)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.APP_DIR }}/dist/*

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (unsigned; notarization is a later step, see docs/RELEASE.md)
        working-directory: ${{ env.APP_DIR }}
        env:
          API_URL: ${{ vars.DHANZ_API_URL }}
        run: |
          flutter pub get
          flutter build macos --release ${BUILD_NAME:+--build-name=${BUILD_NAME#v} --build-number=$GITHUB_RUN_NUMBER} --dart-define=DHANZ_API_URL="$API_URL"
          mkdir -p dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/DHANZ AI.app" "dist/dhanz-ai-macos-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.APP_DIR }}/dist/*

  server-image:
    # The backend as a container image: ghcr.io/<owner>/<repo>/api:<version> and :latest,
    # with build provenance and an SBOM attached.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the app jobs. The server-image job also uploads a *.dockerbuild
          # record, which is not a zip this action can extract.
          path: dist
          pattern: "{android,windows,ios,macos}"
          merge-multiple: true
      - name: Write the update manifest (latest.json)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          dist = pathlib.Path("dist")
          def entry(pattern):
              files = sorted(dist.glob(pattern))
              if not files:
                  return None
              f = files[0]
              return {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{f.name}",
                  "sha256": hashlib.sha256(f.read_bytes()).hexdigest(),
              }
          platforms = {k: v for k, v in {
              "windows": entry("*-windows-setup.exe"),
              "android": entry("*.apk"),
              "macos": entry("*-macos-unsigned.zip"),
          }.items() if v}
          manifest = {"version": tag.lstrip("v"), "notes": f"DHANZ AI {tag}", "platforms": platforms}
          (dist / "latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
