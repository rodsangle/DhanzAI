name: Build checked web client with chat preview

on:
  # Publishing updates the web-update channel the live server installs from, so it is started
  # by hand (Actions → this workflow → Run workflow on main) rather than on every push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhanz-web-update-channel
  cancel-in-progress: false

env:
  APP_DIR: apps/dhanz_flutter
  RELEASE_ID: web-updates-0.10.14-preview.1
  WEB_VERSION: "0.10.14"
  WEB_BUILD: "55"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install local media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          (cd backend && python -m pip install -r requirements-dev.txt)
      - name: Test cloud integration protocol and account isolation
        run: python -m pytest tests/studio/test_integrations.py tests/studio/test_app_building_models.py tests/studio/test_builder.py -q
      - name: Test actual local media rendering and private queue
        run: python scripts/release/check_local_media.py
      - name: Resolve the existing locked dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get --enforce-lockfile
      - name: Test phone cache refresh without erasing account storage
        run: node tests/web_update_cache.test.cjs
      - name: Analyze the actual client and controls tests
        working-directory: ${{ env.APP_DIR }}
        run: python ../../scripts/release/analyze_web_updates.py
      - name: Test spelling and existing read-aloud integration
        working-directory: ${{ env.APP_DIR }}
        run: python ../../scripts/release/test_background_uploads.py
      - name: Test browser clipboard paste gestures
        working-directory: ${{ env.APP_DIR }}
        run: python ../../scripts/release/test_background_uploads.py --platform chrome test/browser
      - name: Compile the actual web client
        working-directory: ${{ env.APP_DIR }}
        run: flutter build web --release --no-pub --base-href=/app/ --dart-define=DHANZ_API_URL=https://dhanzai.com --dart-define=DHANZ_WEB_VERSION=${{ env.WEB_VERSION }} --dart-define=DHANZ_WEB_BUILD=${{ env.WEB_BUILD }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package only the compiled web client
        run: python scripts/release/package_web_updates.py
      - name: Protect the channel from older or identical build reruns
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dhanz-current-web-channel
          if ! gh release view web-update-channel >/dev/null 2>&1; then
            gh release create web-update-channel --target "$GITHUB_SHA" --prerelease --latest=false --title "Latest checked Dhanz web build" --notes "Public web-only update manifest, published after checked release assets."
          fi
          gh release view web-update-channel --json assets > /tmp/dhanz-current-web-channel/assets.json
          if python -c "import json; raise SystemExit(not any(a['name']=='latest-web.json' for a in json.load(open('/tmp/dhanz-current-web-channel/assets.json'))['assets']))"; then
            gh release download web-update-channel --pattern latest-web.json --dir /tmp/dhanz-current-web-channel --clobber
          fi
          python scripts/release/promote_web_channel.py /tmp/dhanz-current-web-channel/latest-web.json dist/web-updates/latest-web.json >> "$GITHUB_OUTPUT"
      - name: Publish the checked browser build
        if: steps.channel.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            gh release upload "$RELEASE_ID" dist/web-updates/* --clobber
          else
            gh release create "$RELEASE_ID" dist/web-updates/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Dhanz 0.10.14 branch, archive and share" --notes "Checked Dhanz 0.10.14 web build. Branch in new chat from any reply; archive chats (Settings → Archived chats restores them); share a chat with a public read-only link that you can revoke (Settings → Shared links). Shared links show the chat as it was when shared, without attachments, tool details or your name. These need the server update from scripts/server/deploy_conversation_extras.py; on servers without it the app says so. Keeps every 0.10.13 feature. Web only; no native APK or Windows installer is published."
          fi
      - name: Publish latest web channel after the checked release assets
        if: steps.channel.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view web-update-channel >/dev/null 2>&1; then
            gh release upload web-update-channel dist/web-updates/latest-web.json --clobber
          else
            gh release create web-update-channel dist/web-updates/latest-web.json --target "$GITHUB_SHA" --prerelease --latest=false --title "Latest checked Dhanz web build" --notes "Public web-only updater channel. Points to the checked versioned web release; does not select an Android APK or Windows installer."
          fi
